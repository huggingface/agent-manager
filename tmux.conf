# Make the mode visible: a short toast whenever a pane enters copy mode.
set -g message-style "fg=#0e1217,bg=#5fd0d8"
set-hook -g pane-mode-changed { if -F '#{pane_in_mode}' { display-message -d 2500 'copy mode — just type to return to the prompt (Esc exits)' } }
