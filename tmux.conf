# Agent Manager tmux config (passed via `tmux -f`).
set -g status off                 # hide the status bar at the bottom
# Mouse OFF on purpose: with mouse on, tmux captures drags into its own
# copy-mode, so the browser terminal never owns the selection and the only way
# back to the system clipboard is an async OSC 52 write that browsers block
# (no user gesture). With it off, a plain drag is a normal xterm.js selection
# that we copy synchronously on mouse-up. The wheel scrolls xterm's scrollback.
set -g mouse off
set -g history-limit 100000       # deep scrollback
set -g window-size latest         # size the window to the active client
set -g destroy-unattached off     # keep sessions alive when no client attached
set -g escape-time 10
# Still honour OSC 52 if a program inside a pane sets the clipboard itself.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
